name: Orte geocodieren

on:
  push:
    branches: [main]
    paths: [data/projekte.json]

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/geocode.mjs
      - name: Commit, falls sich orte.json geändert hat
        run: |
          if git diff --quiet -- data/orte.json; then echo "Keine neuen Orte."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orte.json
          git commit -m "Orte geocodiert [bot]"
          git pull --rebase origin main
          git push
